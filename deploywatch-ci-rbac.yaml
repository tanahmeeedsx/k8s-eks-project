apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploywatch-ci-deployer
  namespace: two-tier-ns
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - two-tier-app
    verbs:
      - get
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploywatch-ci-deployer-binding
  namespace: two-tier-ns
subjects:
  - kind: Group
    name: deploywatch-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deploywatch-ci-deployer
  apiGroup: rbac.authorization.k8s.io
