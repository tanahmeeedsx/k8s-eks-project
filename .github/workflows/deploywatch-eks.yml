name: DeployWatch EKS CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: full-stack-cluster
  DOCKER_IMAGE: doctanjim/deploywatch

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::530629633924:role/deploywatch-github-actions-eks-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push DeployWatch Image
        uses: docker/build-push-action@v6
        with:
          context: ./deploywatch-source
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Update EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Deploy Updated Image to EKS
        run: |
          kubectl set image deployment/two-tier-app \
            two-tier-app="$DOCKER_IMAGE:$GITHUB_SHA" \
            -n two-tier-ns

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/two-tier-app \
            -n two-tier-ns \
            --timeout=180s
