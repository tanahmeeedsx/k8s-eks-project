apiVersion: apps/v1
kind: Deployment
metadata:
  name: two-tier-app
  namespace: two-tier-ns
  labels:
    app: two-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: two-tier-app
  template:
    metadata:
      labels:
        app: two-tier-app
    spec:
      serviceAccountName: deploywatch-reader
      containers:
        - name: two-tier-app
          image: doctanjim/deploywatch:v3
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_NAME
              value: attendance_db
          ports:
            - containerPort: 5000
